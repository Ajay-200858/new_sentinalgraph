<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SentinelGraph</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
        }
        .login-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        /* Left Side: Presentation */
        .login-left {
            flex: 1;
            position: relative;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }
        

        
        .login-branding {
            position: relative;
            z-index: 10;
            max-width: 500px;
        }
        .login-branding h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-blue-glow);
            letter-spacing: -1px;
            margin-bottom: 20px;
        }
        .login-branding p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        /* Right Side: Form */
        .login-right {
            width: 500px;
            background-color: rgba(5, 8, 15, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            z-index: 20;
        }
        
        .login-box {
            width: 100%;
            max-width: 380px;
            animation: pageFadeInSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .login-box h2 { 
            font-size: 1.75rem; 
            margin-bottom: 8px; 
            color: var(--text-primary); 
        }
        .login-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .form-group { margin-bottom: 24px; position: relative; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-secondary); 
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: rgba(255,255,255,0.02);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: rgba(59, 130, 246, 0.05);
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            font-size: 1.05rem; 
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        
        .error-msg { 
            color: var(--accent-red); 
            font-size: 0.9rem; 
            margin-top: 15px; 
            text-align: center; 
            min-height: 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: var(--radius-sm);
            padding: 10px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .links { 
            margin-top: 30px; 
            text-align: center; 
            font-size: 0.9rem; 
        }
        .links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            transition: color 0.2s;
        }
        .links a:hover {
            color: var(--accent-blue);
        }
        
        .login-sys-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .status-dot-sm {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
            animation: livePulse 2s infinite ease-in-out;
        }

        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="login-layout">
        <!-- Left Presentation Side -->
        <div class="login-left">
            <div class="login-branding">
                <h1>SENTINELGRAPH</h1>
                <p>Secure authentication gateway for the AI-powered Security Operations Center. Real-time network intelligence and threat forecasting.</p>
            </div>
        </div>

        <!-- Right Form Side -->
        <div class="login-right">
            <div class="login-box">
                <h2>Welcome Back</h2>
                <div class="login-subtitle">Please authenticate to access the SOC.</div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" value="admin" required placeholder="Enter SOC username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" value="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary btn-submit" id="loginBtn">Authenticate to SOC</button>
                    <div id="errorMsg" class="error-msg"></div>
                </form>
                
                <div class="links">
                    <a href="index.html">← Return to System Overview</a>
                </div>
            </div>
            
            <div class="login-sys-status">
                <div class="status-dot-sm"></div> SECURE CONNECTION VERIFIED
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/global-bg.js"></script>
    <script>
        // Existing Login Logic Unchanged
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");
            const err = document.getElementById("errorMsg");
            
            btn.disabled = true;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Authenticating...`;
            err.style.display = "none";
            err.textContent = "";

            try {
                const res = await window.api.login(u, p);
                if (res.token) {
                    localStorage.setItem("sg_token", res.token);
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                err.textContent = error.message;
                err.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Authenticate to SOC";
            }
        });

        // Add simple spinner CSS dynamically
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

    </script>
</body>
</html>
