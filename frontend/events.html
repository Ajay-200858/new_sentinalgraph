<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Events - SentinelGraph</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            font-weight: bold;
        }
        .search-box {
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-width: 250px;
        }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                    <h2>Security Events Telemetry</h2>
                    <p class="text-muted">Live adversarial security events recorded into PostgreSQL.</p>
                </div>
                <button class="btn-secondary" onclick="loadEvents()">Refresh</button>
            </div>
            
            <div class="filter-container">
                <div class="filter-bar" id="filter-bar"></div>
                <input type="text" id="event-search" class="search-box" placeholder="Search by IP, attack type, or MITRE..." oninput="handleSearch(this.value)">
            </div>

            <table id="events-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Attack Type</th>
                        <th>Severity</th>
                        <th>Source IP</th>
                        <th>Destination IP</th>
                        <th>MITRE Tactic</th>
                        <th>MITRE Technique</th>
                        <th>Risk Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/events.js"></script>
</body>
</html>
