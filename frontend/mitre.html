<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITRE ATT&CK - SentinelGraph</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="main-content">
        <div class="card">
            <h2>MITRE ATT&CK Framework Mapping</h2>
            <p class="text-muted" style="margin-bottom: 20px;">Detected threats automatically mapped to MITRE tactics and techniques.</p>
            
            <table id="mitre-table">
                <thead>
                    <tr>
                        <th>Tactic</th>
                        <th>Technique</th>
                        <th>Associated Attack Type</th>
                        <th>Detection Count</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        async function loadMitre() {
            const tbody = document.querySelector('#mitre-table tbody');
            try {
                const data = await window.api.getMitre();
                if (!tbody) return;
                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No adversarial threats mapped yet. Upload a CSV or run replay to populate MITRE ATT&CK detections.</td></tr>';
                    return;
                }

                data.forEach(m => {
                    const tr = document.createElement('tr');
                    const badgeClass = m.attack_type.toLowerCase() === 'benign' ? 'badge-benign' : `badge-${m.attack_type.toLowerCase()}`;
                    tr.innerHTML = `
                        <td><strong>${m.tactic || 'Unknown'}</strong></td>
                        <td><code>${m.technique || 'Technique not mapped'}</code></td>
                        <td><span class="badge ${badgeClass}">${m.attack_type}</span></td>
                        <td><strong>${m.count.toLocaleString()}</strong></td>
                        <td>${m.description || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Failed to load MITRE mappings:", err);
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--accent-red); padding: 20px;">Failed to load MITRE ATT&CK telemetry from backend.</td></tr>';
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadMitre();
            setInterval(loadMitre, 10000);
        });
    </script>
</body>
</html>
