<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - SentinelGraph</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="main-content">
        <div class="card">
            <h2>System Architecture Status</h2>
            <p class="text-muted" style="margin-bottom: 20px;">Detailed health check of backend components.</p>
            
            <div class="grid grid-cols-2" id="status-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        async function loadStatus() {
            try {
                const data = await window.api.getSystemStatus();
                const grid = document.getElementById('status-grid');
                grid.innerHTML = '';
                
                Object.keys(data).forEach(k => {
                    const val = data[k];
                    const isOk = val === "Connected" || val === "Ready" || val === "Running" || val === "Idle" || val.includes("OK") || val.includes("Active");
                    const color = k === 'last_checked' ? 'var(--text-secondary)' : (isOk ? 'var(--accent-green)' : 'var(--accent-red)');
                    
                    grid.innerHTML += `
                        <div style="background: var(--bg-tertiary); padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div style="color: var(--text-secondary); text-transform: capitalize;">${k.replace('_', ' ')}</div>
                            <div style="font-size: 1.2rem; font-weight: bold; margin-top: 5px; color: ${color}">${val}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Failed", err);
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadStatus();
            setInterval(loadStatus, 5000);
        });
    </script>
</body>
</html>
