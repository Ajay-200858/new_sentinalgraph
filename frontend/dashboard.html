<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SentinelGraph</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="main-content">
        
        <div id="empty-state" class="empty-state" style="display: none;">
            <h3>No network data available yet.</h3>
            <p>Upload a CSV or start a replay to begin analysis.</p>
            <br>
            <button class="btn-primary" onclick="window.location.href='replay.html'">Go to Replay Control</button>
        </div>

        <div id="dashboard-content">
            <div class="grid grid-cols-6" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <div class="card">
                    <div class="text-muted">Total Flows</div>
                    <div class="kpi-value" id="kpi-total-flows">0</div>
                </div>
                <div class="card">
                    <div class="text-muted">Predictions</div>
                    <div class="kpi-value" id="kpi-predictions">0</div>
                </div>
                <div class="card">
                    <div class="text-muted">Attacks Detected</div>
                    <div class="kpi-value" id="kpi-attacks">0</div>
                </div>
                <div class="card">
                    <div class="text-muted">High Risk Events</div>
                    <div class="kpi-value" id="kpi-high-risk">0</div>
                </div>
                <div class="card">
                    <div class="text-muted">Active Hosts</div>
                    <div class="kpi-value" id="kpi-active-hosts">0</div>
                </div>
                <div class="card">
                    <div class="text-muted">Current Risk</div>
                    <div class="kpi-value" id="kpi-risk" style="color: var(--accent-red);">0</div>
                </div>
            </div>

            <div class="grid grid-cols-2">
                <div class="card">
                    <h3>Attack Distribution</h3>
                    <canvas id="attackChart" style="max-height: 300px;"></canvas>
                </div>
                <div class="card">
                    <h3>Risk Projection</h3>
                    <canvas id="riskChart" style="max-height: 300px;"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Recent Security Events</h3>
                <table id="recent-events-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Source</th>
                            <th>Destination</th>
                            <th>Attack Type</th>
                            <th>Risk</th>
                            <th>Severity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
